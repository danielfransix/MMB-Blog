  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
}

<!-- ===== STEP 2: GOOGLE FONTS LOADER WITH WEBFLOW COMPATIBILITY ===== -->
<script>
(function() {
  // Configuration - Update these with your actual Google Fonts
  const googleFonts = [
    {
      family: 'Clash Grotesk',
      weights: ['200', '300', '400', '500', '600']
    }
    // Add your actual Google Fonts here
  ];

  // Function to disable existing Google Font links
  function disableExistingGoogleFonts() {
    // Find all Google Font links
    const fontLinks = document.querySelectorAll('link[href*="fonts.googleapis.com"]');
    fontLinks.forEach(link => {
      // Disable them temporarily
      link.disabled = true;
      // Store reference for later
      link.setAttribute('data-original-font', 'true');
    });
  }

  // Function to load Google Fonts with Web Font Loader
  function loadGoogleFonts() {
    // First, disable any existing Google Font links
    disableExistingGoogleFonts();

    // Load Web Font Loader
    const script = document.createElement('script');
    script.src = 'https://ajax.googleapis.com/ajax/libs/webfont/1.6.26/webfont.js';
    script.onload = function() {
      // Configure font families
      const families = googleFonts.map(font => {
        const weights = font.weights ? ':' + font.weights.join(',') : '';
        return font.family + weights;
      });

      // Load fonts
      WebFont.load({
        google: {
          families: families
        },
        active: function() {
          // All fonts loaded successfully
          console.log('Google Fonts loaded successfully');
          
          // Add class to body
          document.body.classList.add('fonts-loaded');
          
          // Re-enable original font links
          const originalFontLinks = document.querySelectorAll('link[data-original-font]');
          originalFontLinks.forEach(link => {
            link.disabled = false;
          });
          
          // Remove system font override after a brief moment
          setTimeout(() => {
            const systemFontStyle = document.getElementById('system-font-override');
            if (systemFontStyle) {
              systemFontStyle.remove();
            }
          }, 200);
          
          // Store in session
          sessionStorage.setItem('fonts-loaded', 'true');
        },
        inactive: function() {
          // Fonts failed to load
          console.warn('Google Fonts failed to load, keeping system fonts');
          // Still remove the override to allow any fallback fonts
          setTimeout(() => {
            const systemFontStyle = document.getElementById('system-font-override');
            if (systemFontStyle) {
              systemFontStyle.remove();
            }
          }, 1000);
        },
        timeout: 5000 // 5 second timeout
      });
    };
    document.head.appendChild(script);
  }

  // Function to handle Webflow's font loading
  function handleWebflowFonts() {
    // Find Webflow's CSS file
    const webflowCSS = document.querySelector('link[href*="webflow"]');
    if (webflowCSS) {
      // Monitor when it loads
      if (webflowCSS.sheet) {
        // Already loaded
        extractAndLoadFonts();
      } else {
        // Wait for it to load
        webflowCSS.addEventListener('load', extractAndLoadFonts);
      }
    }
  }

  // Function to extract font families from Webflow CSS
  function extractAndLoadFonts() {
    // If fonts were already loaded in this session, skip
    if (sessionStorage.getItem('fonts-loaded') === 'true') {
      document.body.classList.add('fonts-loaded');
      setTimeout(() => {
        const systemFontStyle = document.getElementById('system-font-override');
        if (systemFontStyle) {
          systemFontStyle.remove();
        }
      }, 100);
      return;
    }

    // Look for Google Font links in the document
    const googleFontLinks = document.querySelectorAll('link[href*="fonts.googleapis.com"]');
    if (googleFontLinks.length > 0) {
      // Extract font families from the links
      const extractedFonts = [];
      googleFontLinks.forEach(link => {
        const url = new URL(link.href);
        const familyParam = url.searchParams.get('family');
        if (familyParam) {
          // Parse families
          const families = familyParam.split('|');
          families.forEach(family => {
            const [name, weights] = family.split(':');
            extractedFonts.push({
              family: name.replace(/\+/g, ' '),
              weights: weights ? weights.split(',') : ['400']
            });
          });
        }
      });

      // Update configuration if we found fonts
      if (extractedFonts.length > 0) {
        googleFonts.length = 0;
        googleFonts.push(...extractedFonts);
      }
    }

    // Load the fonts
    loadGoogleFonts();
  }

  // Preconnect to Google Fonts for faster loading
  function addPreconnects() {
    ['https://fonts.googleapis.com', 'https://fonts.gstatic.com'].forEach(url => {
      const link = document.createElement('link');
      link.rel = 'preconnect';
      link.href = url;
      link.crossOrigin = '';
      document.head.appendChild(link);
    });
  }

  // Initialize
  function init() {
    // Add preconnects immediately
    addPreconnects();

    // Handle Webflow fonts
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', handleWebflowFonts);
    } else {
      handleWebflowFonts();
    }

    // Fallback: Load fonts after a delay if nothing else works
    setTimeout(() => {
      if (!document.body.classList.contains('fonts-loaded')) {
        loadGoogleFonts();
      }
    }, 1000);
  }

  // Start the process
  init();
})();
</script>

<!-- ===== STEP 4: PERFORMANCE MONITORING ===== -->
<script>
// Monitor font loading performance
if ('PerformanceObserver' in window) {
  const observer = new PerformanceObserver((list) => {
    for (const entry of list.getEntries()) {
      if (entry.name.includes('fonts.googleapis.com') || entry.name.includes('fonts.gstatic.com')) {
        console.log(`Font resource loaded: ${entry.name} - Duration: ${entry.duration}ms`);
      }
    }
  });
  observer.observe({ entryTypes: ['resource'] });
}

// Log when fonts are applied
document.addEventListener('DOMContentLoaded', function() {
  const startTime = performance.now();
  
  // Check when fonts-loaded class is added
  const observer = new MutationObserver((mutations) => {
    mutations.forEach((mutation) => {
      if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
        if (document.body.classList.contains('fonts-loaded')) {
          const loadTime = performance.now() - startTime;
          console.log(`Fonts loaded and applied in ${loadTime.toFixed(2)}ms`);
          observer.disconnect();
        }
      }
    });
  });
  
  observer.observe(document.body, { attributes: true });
});
</script>
